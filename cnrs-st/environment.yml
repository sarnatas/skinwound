name: cnrs-st
# CNRS professional training, spatial transcriptomics (Visium), 24-25 November 2026.
# Versions tested together on Linux (Python 3.11). Three pins are deliberate:
#   harmonypy==0.0.10   (>= 0.2 breaks sc.external.pp.harmony_integrate: wrong output shape)
#   pynndescent<0.6     (0.7 returns csr_array: sc.pp.neighbors fails on 'getnnz')
#   scikit-learn<1.8    (same csr_array problem with scanpy 1.11)
channels:
  - conda-forge
dependencies:
  - python=3.11
  - pip
  - pip:
      - scanpy==1.11.5
      - anndata==0.12.19
      - squidpy==1.8.2
      - spatialdata==0.7.3
      - spatialdata-io==0.7.1
      - spatialdata-plot==0.4.0
      - leidenalg==0.12.0
      - igraph==1.0.0
      - harmonypy==0.0.10
      - pynndescent<0.6
      - scikit-learn<1.8
      - scikit-misc
      - pydeseq2==0.5.4
      - cellcharter==0.3.7        # installs PyTorch + Lightning (2-3 GB): build the env before the course
      - tangram-sc==1.0.4
      - seaborn
      - ipykernel
      - jupyterlab
