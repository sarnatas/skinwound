name: skinwound
channels:
  - conda-forge
dependencies:
  - python=3.11
  - pip
  - pip:
      # --- notebook reattivo ---
      - marimo==0.24.0

      # --- core single-cell / spatial ---
      - scanpy==1.11.5
      - anndata==0.12.19
      - squidpy==1.8.2
      - spatialdata==0.7.3
      - spatialdata-io==0.7.1
      - spatialdata-plot==0.4.0

      # --- clustering (Leiden) ---
      - leidenalg==0.12.0
      - python-igraph==1.0.0

      # --- immagini / utility ---
      - scikit-image
      - openpyxl

      # --- batch correction demo (ST + sc) ---
      - harmonypy
      - bbknn
      - scanorama

      # --- clustering resolution selection ---
      - git+https://github.com/spatial-cell-id/resolute.git

      # --- spatial deconvolution (Cell2location) ---
      # versions tested together (Linux, CPU) in a smoke test; pyro-ppl is pinned
      # to 1.9.1 because cell2location 0.1.5 imports `deep_getattr`, which was
      # removed in pyro-ppl 1.9.2 (ImportError otherwise)
      - scvi-tools==1.4.2
      - cell2location==0.1.5
      - pyro-ppl==1.9.1
