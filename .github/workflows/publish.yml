name: Publish site

# Every push to main rebuilds and republishes the site, so that editing
# ens-ngs/notebooks/Analysis_students.ipynb (or any .qmd page) updates it automatically.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: quarto-dev/quarto-actions/setup@v2

      # Quarto needs Jupyter to read .ipynb files. Notebooks are NOT executed
      # (execute: enabled: false in _quarto.yml): no data and no heavy environment needed.
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install jupyter pyyaml

      - run: quarto render

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
